services:
  # 1. Document Database for the Problem Service
  mongodb:
    image: mongo:7.0
    container_name: dsa-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 2. In-Memory Store for API Gateway Rate Limiting
  redis:
    image: redis:7.2-alpine
    container_name: dsa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. The Isolated Code Execution Environment
  runner-build:
    image: personal-dsa-runner:latest
    build:
      context: ./runner
    profiles: [build-runner]

volumes:
  mongodb_data:
